{% if page_obj.has_other_pages %}<nav class="mt-3 d-flex flex-wrap gap-3" aria-label="Pagination">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if status %}&amp;status={{ status|urlencode }}{% endif %}">Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if status %}&amp;status={{ status|urlencode }}{% endif %}">Next</a>{% endif %}</nav>{% endif %}
